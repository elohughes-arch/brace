<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Brace — Owners Portal</title>
  <meta name="description" content="The Brace training-data pipeline — owners only." />
  <meta name="theme-color" content="#2A2C29" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../assets/brand/brace-icon-tile.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-logo" viewBox="-5 -4 80 116"><path d="M0,105 L35,5 L70,105" fill="none" stroke="currentColor" stroke-width="6.6"/><circle cx="35" cy="71" r="9.6" fill="#F05A28"/></symbol>
      <symbol id="i-signout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h10"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15" r="1.3"/></symbol>
      <symbol id="i-loader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M21 12a9 9 0 0 0-9-9" opacity="0.25"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h4M3 15h4M17 9h4M17 15h4M9 5v14M15 5v14"/></symbol>
    </defs>
  </svg>

  <div id="root"><div class="center-load"><svg width="22" height="22" class="spin" aria-hidden="true"><use href="#i-loader"/></svg></div></div>

  <!-- If portal.js never evaluates or never settles, nothing inside it can
       report that. This does. It stands down the moment the portal draws
       anything (root.dataset.up), and it says which step was reached
       (root.dataset.bootStage) rather than guessing at a cause.

       It also carries the one control that must work when nothing else does:
       clearing the stored session. A session that cannot be loaded cannot be
       signed out of from inside the portal, which leaves the only way out
       behind the very door that is stuck. -->
  <script>
    (function () {
      var shown = false;

      function reset() {
        try {
          localStorage.removeItem('brace-portal-auth');
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf('sb-') === 0 || k.indexOf('brace-portal') === 0) localStorage.removeItem(k);
          });
          sessionStorage.clear();
        } catch (e) { /* private browsing; the reload is still worth doing */ }
        location.replace(location.pathname);
      }

      function fail(detail) {
        var r = document.getElementById('root');
        if (shown || !r || r.dataset.up) return;
        shown = true;
        var stage = r.dataset.bootStage || 'loading its scripts';
        r.innerHTML = '<div class="gate"><div class="gate-card">'
          + '<div class="gate-tag">Owners portal</div>'
          + '<h1>The portal could not start</h1>'
          + '<p class="gate-lede">It got as far as <b class="stage"></b> and stopped there.</p>'
          + '<div class="err"></div>'
          + '<button class="btn" id="pf-retry">Try again</button>'
          + '<button class="btn btn-ghost" id="pf-reset" style="margin-top:10px">Forget this session and start over</button>'
          + '<div class="gate-foot">Starting over signs you out of the portal in this '
          + 'browser and asks for your password again. It does not touch your account.'
          + '<br /><a href="../">Back to Brace</a></div>'
          + '</div></div>';
        r.querySelector('.stage').textContent = stage;
        r.querySelector('.err').textContent = detail || '';
        r.querySelector('#pf-retry').onclick = function () { location.replace(location.pathname); };
        r.querySelector('#pf-reset').onclick = reset;
      }

      addEventListener('error', function (e) {
        // Capture phase also sees every failed image and stylesheet. A missing
        // video thumbnail must not replace the page, so only a script that
        // failed to load counts as fatal here.
        if (e.target && e.target !== window) {
          if (e.target.tagName === 'SCRIPT') fail('Could not load ' + (e.target.src || 'a script'));
          return;
        }
        fail(e.message || String(e.error || 'Unknown error'));
      }, true);
      addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        fail((r && (r.message || r.error_description)) || String(r || ''));
      });
      // Nothing drawn after twenty seconds means something is hanging silently.
      // Generous on purpose: the portal's own steps time out before this, and
      // this only has to catch a stall that reports nothing at all.
      setTimeout(function () { fail('It stopped responding without reporting an error.'); }, 20000);
    })();
  </script>
  <script src="../assets/vendor/supabase-js-2.45.4.js"></script>
  <script type="module" src="portal.js"></script>
  <script src="portal-select.js"></script>
</body>
</html>
