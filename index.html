  <!-- ============ THE PAGE — one viewport ============ -->
  <div class="page" id="page">

    <header class="bar">
      <a class="brand" href="#" aria-label="Brace">
        <img class="brand-mark" src="assets/brand/brace-a-mark-white.svg" alt="Brace" width="80" height="116" />
      </a>
      <nav class="bar-actions">
        <a class="link" href="app/">Sign in</a>
        <a class="btn btn-ghost" href="app/">Create account</a>
      </nav>
    </header>

    <main class="hero">
      <img class="hero-wm" src="assets/brand/brace-wordmark-white.svg"
           alt="Brace" width="486" height="118" />
      <h1 class="strap">The Modern Shooting Log</h1>

      <form class="capture" id="signupForm" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@estate.com" autocomplete="email" required />
        <button class="btn btn-primary" type="submit">Request early access</button>
      </form>
      <p class="capture-note" id="email-err" hidden>Enter a valid email address.</p>
      <p class="capture-ok" id="formSuccess" tabindex="-1">You're on the founding list — we'll be in touch before launch.</p>

      <span class="chip"><span class="pip"></span>Now in development</span>
    </main>

    <footer class="bar bar-foot">
      <span class="legal">© 2026 Brace · braceshooting.com</span>
      <span class="foot-links">
        <a href="mailto:hello@braceshooting.com">Contact</a>
        <a href="portal/">Owners</a>
      </span>
    </footer>

  </div>

  <script src="script.js" defer></script>
