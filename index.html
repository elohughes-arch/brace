<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Brace — The Modern Shooting Log</title>
  <meta name="description" content="Brace — the modern shooting log. Now in development." />
  <meta name="theme-color" content="#2A2C29" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Brace — The Modern Shooting Log" />
  <meta property="og:description" content="The modern shooting log. Now in development." />
  <meta property="og:url" content="https://braceshooting.com" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/brand/brace-icon-tile.svg" />
  <link rel="apple-touch-icon" href="assets/brand/brace-icon-tile.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ SPLASH — the wordmark lands, the clay holds, then smokes ============ -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-lockup">
      <img class="splash-wm" src="assets/brand/brace-wordmark-white.svg" alt="" width="3579" height="732" />
      <!-- erases the clay as it goes to powder; sits on the flat ground, so seamless -->
      <span class="dot-cover"></span>
      <span class="powder">
          <i class="grain" style="--tx:32.4px;--ty:-25.6px;--s:2.7px;--gd:0.02s;--gt:0.52s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-8.2px;--ty:-61.7px;--s:1.6px;--gd:0.01s;--gt:0.55s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-47.3px;--ty:-35.0px;--s:1.7px;--gd:0.0s;--gt:0.71s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-20.6px;--ty:-9.5px;--s:2.5px;--gd:0.03s;--gt:0.66s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-49.7px;--ty:-58.9px;--s:2.9px;--gd:0.05s;--gt:0.54s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:67.4px;--ty:-33.2px;--s:2.6px;--gd:0.03s;--gt:0.68s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-30.4px;--ty:-20.5px;--s:2.3px;--gd:0.04s;--gt:0.56s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-50.5px;--ty:-18.2px;--s:3.1px;--gd:0.14s;--gt:0.72s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:46.5px;--ty:-61.7px;--s:2.9px;--gd:0.04s;--gt:0.54s;background:var(--clay)"></i>
          <i class="grain" style="--tx:53.5px;--ty:-51.4px;--s:1.7px;--gd:0.06s;--gt:0.7s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:41.1px;--ty:-55.2px;--s:1.8px;--gd:0.05s;--gt:0.59s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-30.4px;--ty:-25.6px;--s:3.2px;--gd:0.02s;--gt:0.54s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:43.7px;--ty:18.8px;--s:1.6px;--gd:0.09s;--gt:0.61s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:54.1px;--ty:-36.0px;--s:3.0px;--gd:0.07s;--gt:0.68s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-28.9px;--ty:-79.9px;--s:1.9px;--gd:0.11s;--gt:0.72s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:2.5px;--ty:-15.0px;--s:2.3px;--gd:0.14s;--gt:0.53s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:19.1px;--ty:-45.1px;--s:1.9px;--gd:0.03s;--gt:0.68s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-21.6px;--ty:-61.3px;--s:2.4px;--gd:0.1s;--gt:0.61s;background:var(--clay)"></i>
      </span>
    </div>
  </div>

  <!-- ============ THE PAGE — one viewport ============ -->
  <div class="page" id="page">

    <header class="bar">
      <a class="brand" href="#" aria-label="Brace">
        <img class="brand-mark" src="assets/brand/brace-a-mark-white.svg" alt="Brace" width="740" height="732" />
      </a>
      <nav class="bar-actions">
        <a class="link" href="app/">Sign in</a>
        <a class="btn btn-ghost" href="app/">Create account</a>
      </nav>
    </header>

    <main class="hero">
      <h1 class="strap">The Modern Shooting Log</h1>

      <form class="capture" id="signupForm" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@estate.com" autocomplete="email" required />
        <button class="btn btn-primary" type="submit">Request early access</button>
      </form>
      <p class="capture-note" id="email-err" hidden>Enter a valid email address.</p>
      <p class="capture-ok" id="formSuccess" tabindex="-1">You're on the founding list — we'll be in touch before launch.</p>

      <span class="chip"><span class="pip"></span>Now in development</span>
    </main>

    <footer class="bar bar-foot">
      <span class="legal">© 2026 Brace · braceshooting.com</span>
      <span class="foot-links">
        <a href="mailto:hello@braceshooting.com">Contact</a>
        <a href="portal/">Owners</a>
      </span>
    </footer>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
