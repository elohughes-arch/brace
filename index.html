<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Brace — The Modern Shooting Log</title>
  <meta name="description" content="Brace — the modern shooting log. Now in development." />
  <meta name="theme-color" content="#2A2C29" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Brace — The Modern Shooting Log" />
  <meta property="og:description" content="The modern shooting log. Now in development." />
  <meta property="og:url" content="https://braceshooting.com" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/brand/brace-icon-tile.svg" />
  <link rel="apple-touch-icon" href="assets/brand/brace-icon-tile.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ SPLASH — the wordmark lands, the clay holds, then smokes ============ -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-lockup">
      <img class="splash-wm" src="assets/brand/brace-wordmark-white.svg" alt="" width="3579" height="732" />
      <!-- erases the clay as it goes to powder; sits on the flat ground, so seamless -->
      <span class="dot-cover"></span>
      <span class="powder">
          <i class="grain" style="--tx:-42.9px;--ty:-2.0px;--s:2.9px;--gd:0.05s;--gt:0.59s;background:var(--clay)"></i>
          <i class="grain" style="--tx:25.7px;--ty:-103.8px;--s:2.0px;--gd:0.09s;--gt:0.67s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-109.8px;--ty:-69.8px;--s:3.5px;--gd:0.02s;--gt:0.62s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-51.7px;--ty:-27.7px;--s:3.9px;--gd:0.04s;--gt:0.58s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:4.1px;--ty:-80.4px;--s:4.4px;--gd:0.0s;--gt:0.57s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-69.4px;--ty:-69.2px;--s:2.3px;--gd:0.09s;--gt:0.55s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:30.1px;--ty:-70.8px;--s:4.0px;--gd:0.06s;--gt:0.65s;background:var(--clay)"></i>
          <i class="grain" style="--tx:76.4px;--ty:-89.5px;--s:4.4px;--gd:0.04s;--gt:0.62s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-39.1px;--ty:26.2px;--s:3.9px;--gd:0.08s;--gt:0.63s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:36.6px;--ty:-61.4px;--s:3.6px;--gd:0.09s;--gt:0.53s;background:var(--clay)"></i>
          <i class="grain" style="--tx:81.6px;--ty:-53.0px;--s:2.2px;--gd:0.03s;--gt:0.68s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-103.4px;--ty:-23.5px;--s:4.0px;--gd:0.06s;--gt:0.7s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-92.8px;--ty:-41.8px;--s:3.8px;--gd:0.08s;--gt:0.57s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-46.6px;--ty:-48.9px;--s:4.6px;--gd:0.09s;--gt:0.54s;background:var(--clay)"></i>
          <i class="grain" style="--tx:39.8px;--ty:-37.2px;--s:4.0px;--gd:0.03s;--gt:0.59s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-85.8px;--ty:-15.8px;--s:3.0px;--gd:0.03s;--gt:0.53s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:-77.0px;--ty:-49.9px;--s:4.1px;--gd:0.05s;--gt:0.62s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-16.7px;--ty:-52.1px;--s:3.4px;--gd:0.06s;--gt:0.51s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:3.8px;--ty:-1.4px;--s:2.2px;--gd:0.01s;--gt:0.62s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-74.9px;--ty:-62.3px;--s:3.5px;--gd:0.03s;--gt:0.69s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:67.5px;--ty:-17.2px;--s:4.5px;--gd:0.04s;--gt:0.58s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-92.7px;--ty:-63.3px;--s:2.2px;--gd:0.05s;--gt:0.7s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:24.4px;--ty:-94.9px;--s:3.5px;--gd:0.08s;--gt:0.51s;background:var(--clay)"></i>
          <i class="grain" style="--tx:16.2px;--ty:-67.6px;--s:2.6px;--gd:0.08s;--gt:0.54s;background:var(--clay)"></i>
          <i class="grain" style="--tx:-79.3px;--ty:-80.2px;--s:4.5px;--gd:0.06s;--gt:0.65s;background:var(--clay-dim)"></i>
          <i class="grain" style="--tx:103.6px;--ty:-60.1px;--s:3.8px;--gd:0.0s;--gt:0.56s;background:var(--clay)"></i>
      </span>
    </div>
  </div>

  <!-- ============ THE PAGE — one viewport ============ -->
  <div class="page" id="page">

    <header class="bar">
      <a class="brand" href="#" aria-label="Brace">
        <img class="brand-mark" src="assets/brand/brace-a-mark-white.svg" alt="Brace" width="740" height="732" />
      </a>
      <nav class="bar-actions">
        <a class="link" href="app/">Sign in</a>
        <a class="btn btn-ghost" href="app/">Create account</a>
      </nav>
    </header>

    <main class="hero">
      <h1 class="strap">Your shooting, your data</h1>

      <form class="capture" id="signupForm" novalidate>
        <label class="sr-only" for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@estate.com" autocomplete="email" required />
        <button class="btn btn-primary" type="submit">Request early access</button>
      </form>
      <p class="capture-note" id="email-err" hidden>Enter a valid email address.</p>
      <p class="capture-ok" id="formSuccess" tabindex="-1">You're on the founding list — we'll be in touch before launch.</p>

      <span class="chip"><span class="pip"></span>Now in development</span>
    </main>

    <footer class="bar bar-foot">
      <span class="legal">© 2026 Brace · braceshooting.com</span>
      <span class="foot-links">
        <a href="mailto:hello@braceshooting.com">Contact</a>
        <a href="portal/">Owners</a>
      </span>
    </footer>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
